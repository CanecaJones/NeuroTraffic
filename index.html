<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroTraffic - Simulador de Tráfego com IA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>NeuroTraffic</h1>
    <p>Simulador visual de gerenciamento inteligente de tráfego</p>
  </header>

  <main>
    <canvas id="simulationCanvas" width="800" height="600"></canvas>

    <div class="controls">
      <button id="controllerToggleBtn" class="toggle-button">Ativar IA (Q-Learning)</button>
    </div>

    <section class="metrics-panel" id="metricsPanel">
      <div class="metric">
        <span class="metric-label">Carros gerados</span>
        <span class="metric-value" id="metric-spawned">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">Carros que atravessaram</span>
        <span class="metric-value" id="metric-crossed">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">Tempo médio de espera</span>
        <span class="metric-value" id="metric-avg-wait">0.0s</span>
      </div>
      <div class="metric">
        <span class="metric-label">Fila atual</span>
        <span class="metric-value" id="metric-queue">0</span>
      </div>
      <div class="metric">
        <span class="metric-label">Modo de controle</span>
        <span class="metric-value" id="metric-mode">Regras fixas</span>
      </div>
      <div class="metric">
        <span class="metric-label">Exploração da IA (ε)</span>
        <span class="metric-value" id="metric-epsilon">-</span>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
